[project]
name = "demo"
version = "1.1.1"
description = " FastAPI DDD Toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.6.2",
    "argon2-cffi>=25.1.0",
    "asyncmy>=0.2.11",
    "fastapi>=0.136.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.13.3",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.27",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
